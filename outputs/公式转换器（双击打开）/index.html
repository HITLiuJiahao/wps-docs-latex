<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>公式转换器｜LaTeX 转 WPS/Word 原生公式</title>
    <style>
      :root{--ink:#15263b;--muted:#657489;--line:#dce5ee;--blue:#1866d7;--green:#26784f}
      *{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);background:radial-gradient(circle at 8% 16%,rgba(62,143,255,.1),transparent 22rem),radial-gradient(circle at 92% 4%,rgba(72,210,166,.11),transparent 20rem),#fbfcfe;font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
      main{width:min(820px,calc(100% - 36px));margin:auto;padding:50px 0 70px}.top{display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:800}.mark{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;color:white;background:linear-gradient(145deg,#2679ed,#1657bd);font-size:20px}.local{padding:8px 11px;border:1px solid #cfeadd;border-radius:99px;color:#24724b;background:#eaf8f1;font-size:12px;font-weight:700}
      .hero{text-align:center;margin:72px auto 35px}.hero p{margin:0;color:var(--blue);font-size:12px;font-weight:800;letter-spacing:.12em}.hero h1{margin:14px 0;color:var(--ink);font-size:clamp(36px,7vw,60px);line-height:1.1;letter-spacing:-.06em}.hero .sub{max-width:600px;margin:auto;color:var(--muted);font-size:16px;line-height:1.75;letter-spacing:0;font-weight:400}
      .card{padding:27px;border:1px solid var(--line);border-radius:23px;background:rgba(255,255,255,.88);box-shadow:0 18px 55px rgba(38,67,103,.08)}.eyebrow{margin:0;color:var(--blue);font-size:12px;font-weight:800;letter-spacing:.12em}.card h2{margin:6px 0 20px;font-size:22px;letter-spacing:-.04em}
      .picker{display:grid;place-items:center;min-height:210px;padding:22px;border:1.5px dashed #aabed2;border-radius:17px;background:linear-gradient(#fcfdff,#f5f9ff);text-align:center;cursor:pointer}.picker:hover{border-color:var(--blue)}.picker b{display:block;margin-top:14px;font-size:17px}.picker span{display:block;margin-top:6px;color:var(--muted);font-size:13px}.pick-button,button{border:0;border-radius:10px;background:var(--blue);color:white;cursor:pointer;font:700 14px inherit}.pick-button{display:inline-block;margin-top:17px;padding:10px 15px}
      input{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}.file{display:flex;gap:13px;align-items:center;margin-top:14px;padding:13px;border:1px solid #dce7f2;border-radius:14px;background:white}.docx{display:grid;place-items:center;flex:0 0 auto;width:43px;height:43px;border-radius:10px;background:#e9f2ff;color:#2f71c9;font-size:10px;font-weight:850}.file b{display:block;max-width:510px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}.file span{display:block;margin-top:4px;color:var(--muted);font-size:12px}.action{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-top:14px;padding:17px;border:1px solid #dae6f5;border-radius:14px;background:#f7faff}.action b{display:block;font-size:15px}.action span{display:block;margin-top:4px;color:var(--muted);font-size:13px;line-height:1.5}.action button{padding:11px 16px;white-space:nowrap}.action button:disabled{opacity:.55;cursor:not-allowed}
      #status{margin-top:14px;padding:13px 14px;border:1px solid #d4e4f9;border-radius:13px;background:#f3f8ff;color:#275d9f;font-size:13px}#status[data-kind="error"]{border-color:#f1c7cb;background:#fff5f5;color:#9e3340}#status[data-kind="progress"]::before{content:"";display:inline-block;width:13px;height:13px;margin-right:9px;border:2px solid #c4dbfa;border-top-color:var(--blue);border-radius:50%;vertical-align:-2px;animation:spin .8s linear infinite}
      #result{margin-top:16px;padding:20px;border:1px solid #bde8d0;border-radius:17px;background:linear-gradient(135deg,#f3fcf7,#fbfffd)}.success{color:var(--green);font-size:14px;font-weight:800}.success::before{content:"✓";display:inline-grid;place-items:center;width:24px;height:24px;margin-right:8px;border-radius:50%;color:white;background:#36ab6b}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:17px 0}.metrics>div{padding:13px;border:1px solid #d8ede1;border-radius:12px;background:rgba(255,255,255,.75)}.metrics span{display:block;color:#63836f;font-size:12px}.metrics strong{font-size:26px;letter-spacing:-.05em}.metrics small{margin-left:3px;color:#63836f;font-size:12px}.buttons{display:flex;flex-wrap:wrap;gap:9px}.buttons button{padding:10px 14px}.buttons .secondary{border:1px solid #bdd0e6;background:white;color:#245c9b}
      #report{margin-top:22px;padding:25px 27px;border:1px solid var(--line);border-radius:21px;background:rgba(255,255,255,.86)}.report-heading{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:15px}.report-heading p{margin:0;color:var(--blue);font-size:12px;font-weight:800;letter-spacing:.1em}.report-heading h2{margin:5px 0 0;font-size:21px}.report-heading>span{color:var(--muted);font-size:12px}.record{padding:13px 14px;margin-top:9px;border:1px solid #e2e9f1;border-radius:12px;background:white}.record>div{display:flex;gap:8px;align-items:center;color:#768596;font-size:12px}.ok,.review{padding:3px 7px;border-radius:99px;font-weight:800}.ok{background:#e9f8f0;color:#227550}.review{background:#fff4de;color:#9a5c13}.record code{display:block;overflow:auto;margin-top:9px;color:#233b55;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:nowrap}.record p,.more{margin:7px 0 0;color:#9a5c13;font-size:12px;line-height:1.5}.empty{padding:20px;border-radius:12px;background:#f6f8fb;color:var(--muted);text-align:center}
      .notes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:19px}.notes div{padding:12px}.notes b{font-size:13px}.notes p{margin:4px 0 0;color:var(--muted);font-size:12px;line-height:1.45}.notes em{margin-right:8px;color:#a3b4c5;font:700 11px ui-monospace,monospace;font-style:normal}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:620px){main{width:min(100% - 28px,820px);padding-top:25px}.local{font-size:10px}.hero{margin:42px auto 28px}.card{padding:18px}.action{align-items:stretch;flex-direction:column}.action button{width:100%}.metrics,.notes{grid-template-columns:1fr}.buttons{display:grid;grid-template-columns:1fr}.buttons button{width:100%}.report-heading{align-items:start;flex-direction:column}#report{padding:18px}}
    </style>
  </head>
  <body>
    <main>
      <header class="top"><div class="brand"><span class="mark">∑</span>公式转换器</div><div class="local">● 本地处理，不上传文件</div></header>
      <section class="hero"><p>DOCX → 原生 OFFICE 公式</p><h1>把文档里的 LaTeX 代码<br>变成可编辑公式</h1><p class="sub">保留原有文字、表格与版式；直接生成可由 WPS 和 Word 继续编辑的新文档。</p></section>
      <section class="card">
        <p class="eyebrow">第 1 步</p><h2>选择需要转换的文档</h2>
        <label class="picker" for="file-input"><span style="font-size:30px;color:#1866d7">↑</span><b>选择 DOCX 文件</b><span>文件仅在此浏览器中处理</span><i class="pick-button">浏览文件</i></label>
        <input id="file-input" type="file" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document">
        <div class="file"><span class="docx">DOCX</span><div><b id="file-name">尚未选择文件</b><span id="file-detail">请选择需要转换的 .docx 文档</span></div></div>
        <div class="action"><div><b>直接自动转换</b><span>常见公式会立即转换；不确定或不支持的内容会保留原文并写入报告。</span></div><button id="convert-button" disabled>开始自动转换</button></div>
        <div id="status" hidden><span id="status-text"></span></div>
        <section id="result" hidden><div class="success">转换完成</div><div class="metrics"><div><span>转换文本</span><strong id="converted-count">0</strong><small>处</small></div><div><span>原生公式</span><strong id="formula-count">0</strong><small>个</small></div><div><span>待复核</span><strong id="review-count">0</strong><small>处</small></div></div><div class="buttons"><button id="download-docx">下载转换后的文档</button><button id="download-report" class="secondary">下载转换报告</button></div></section>
      </section>
      <section id="report" hidden></section>
      <section class="notes"><div><em>01</em><b>自动识别</b><p>查找常见 LaTeX 公式代码</p></div><div><em>02</em><b>原生公式</b><p>生成可继续编辑的 OMML</p></div><div><em>03</em><b>转换报告</b><p>清楚列出结果与异常项目</p></div></section>
    </main>
    <script src="./formula-converter.js"></script>
  </body>
</html>
